# Canary — the sma_crossover seed with one rule changed: simple averages become exponential.
site_id: coder
payload:
  thesis: >-
    Medium-term trend persistence: while recent demand outpaces the longer-run average, the
    move tends to continue. An exponential average weights the newest closes more heavily, so
    it turns a bar or two earlier than a simple average of the same length.
  entry_exit: >-
    Hold a full long while the fast EMA of closes is strictly above the slow EMA; go flat
    whenever it is not. Long only — the edge claimed is trend persistence, not symmetry.
  param_space: >-
    fast EMA span 3-30 bars (default 10) and slow EMA span 20-100 bars (default 30), with the
    fast span kept below the slow one. Two tuned parameters, nothing else.
  scenarios: >-
    trend_ride_then_rollover: a flat pad, a 40-bar rally, then a 40-bar selloff — long inside
    the rally and flat again by the end of the selloff. steady_decline_never_longs: a flat pad
    then a 60-bar decline — never long, because on a monotone decline the fast average can
    never rise above the slow one.
  style: momentum
  symbols:
    - AAPL
    - MSFT
provenance: authored:2026-08-02
tags:
  - bucket:canary
  - adapts:sma_crossover
  - rule:exponential-average
