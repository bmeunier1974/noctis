# Canary — the sma_crossover seed with one rule changed: the averages run over highs, not closes.
site_id: coder
payload:
  thesis: >-
    The same trend filter measured on the bar's high rather than its close: the high is where
    demand actually reached during the session, so an average of highs registers a build-up of
    buying pressure a close-based average smooths away.
  entry_exit: >-
    Hold a full long while the fast SMA of bar highs is strictly above the slow SMA of bar
    highs; go flat whenever it is not. Long only, no shorting.
  param_space: >-
    fast SMA lookback 3-30 bars (default 10) and slow SMA lookback 20-100 bars (default 30),
    the fast leg always below the slow one. Two tuned parameters.
  scenarios: >-
    trend_ride_then_rollover: a flat pad, a 40-bar rally, then a 40-bar selloff — long inside
    the rally, flat again by the end of the selloff. steady_decline_never_longs: a flat pad
    then a 60-bar decline — never long, because on a monotone decline each new high sits below
    the last and the fast average of highs can never rise above the slow one.
  style: momentum
  symbols:
    - AAPL
    - MSFT
provenance: authored:2026-08-02
