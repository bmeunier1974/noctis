# Canary — the sma_crossover seed with one rule changed: the flat leg becomes a short leg.
site_id: coder
payload:
  thesis: >-
    Trend persistence read symmetrically: if a fast average above a slow one is worth being
    long, the mirror image is worth being short, and the claim under test is that the down leg
    carries the same persistence the up leg does.
  entry_exit: >-
    Hold a full long while the fast SMA of closes is strictly above the slow SMA, a full short
    while it is strictly below, and stay flat only while the two are equal.
  param_space: >-
    fast SMA lookback 3-30 bars (default 10) and slow SMA lookback 20-100 bars (default 30),
    the fast leg always below the slow one. Two tuned parameters.
  scenarios: >-
    trend_ride_then_flip: a flat pad, a 40-bar rally, then a 40-bar selloff — long inside the
    rally and short inside the selloff. flat_tape_never_trades: a completely flat tape of
    constant closes — never long and never short, because neither average can be strictly
    above the other when every close is identical.
  style: momentum
  symbols:
    - AAPL
    - MSFT
provenance: authored:2026-08-02
