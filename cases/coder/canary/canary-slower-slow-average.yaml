# Canary — the sma_crossover seed with one rule changed: the slow average is a quarter long.
site_id: coder
payload:
  thesis: >-
    The same trend filter read over a quarter rather than six weeks: a fast average above a
    much slower one says demand has outpaced its own longer-run baseline for long enough that
    the move is unlikely to be a single week's noise.
  entry_exit: >-
    Hold a full long while the fast SMA of closes is strictly above the slow SMA; go flat
    whenever it is not. Long only, no shorting.
  param_space: >-
    fast SMA lookback 3-30 bars (default 10) and slow SMA lookback 40-120 bars (default 60) —
    the slow leg deliberately twice the seed's, and the fast leg always below it.
  scenarios: >-
    trend_ride_then_rollover: a flat pad longer than the slow lookback, a 60-bar rally, then a
    60-bar selloff — long inside the rally, flat again by the end of the selloff.
    steady_decline_never_longs: a flat pad then a 90-bar decline — never long, because a
    monotone decline can never lift the fast average above the slow one.
  style: momentum
  symbols:
    - AAPL
    - MSFT
provenance: authored:2026-08-02
tags:
  - bucket:canary
  - adapts:sma_crossover
  - rule:slower-slow-lookback
difficulty:
