# Automated code-quality gates. One-time setup:
#
#   pre-commit install          # run hooks on every `git commit`
#   pre-commit run --all-files  # run the whole suite on demand
#
# Hook versions are pinned to the versions in the dev extras; bump with
# `pre-commit autoupdate`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Keep the 500 KB guard against stray data/blobs, but exempt the uv lockfile:
        # it is an auto-generated, intentionally-committed manifest that legitimately
        # exceeds the limit and grows with the dependency graph.
        args: [--maxkb=500]
        exclude: ^uv\.lock$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The engine fingerprint ratchet, run locally for the same reason mypy is: catch it before the
  # push, not in CI. `language: system` — no isolated env to build, and the script puts `src/` on
  # sys.path itself, so a plain checkout works. Scoped to the files that can move a component
  # digest (plus the record itself); a docs or test edit never triggers it.
  - repo: local
    hooks:
      - id: engine-fingerprint
        name: engine fingerprint (arbiter drift needs an ENGINE_VERSION bump)
        entry: python scripts/engine_fingerprint.py --check
        language: system
        pass_filenames: false
        files: ^(src/noctis/|strategies/|mandate/|MEMORY\.seed\.md|engine_fingerprint\.json)

      # The prompt-asset ratchet, its twin on a different clock: a prompt change fails until the
      # newest docs/prompt-changelog.md entry names the site it moved. Scoped to the prompt-bearing
      # modules plus the record and the changelog itself.
      - id: prompt-fingerprint
        name: prompt fingerprint (a prompt change needs a changelog entry)
        entry: python scripts/prompt_fingerprint.py --check
        language: system
        pass_filenames: false
        files: ^(src/noctis/research/|docs/prompt-changelog\.md|prompt_fingerprint\.json)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # Scope + strictness come from [tool.mypy] in pyproject.toml.
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2.6
          - pydantic-settings>=2.4
          - types-PyYAML
